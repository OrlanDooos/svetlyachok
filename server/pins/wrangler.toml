# Сервер отметок домов от жителей «Светлячка». Cloudflare Workers + D1 (бесплатный тариф).
# Выкладка: npx wrangler d1 create svetlyachok-pins  → вписать database_id ниже,
#           npx wrangler d1 execute svetlyachok-pins --remote --file schema.sql
#           npx wrangler deploy
name = "svetlyachok-pins"
main = "src/index.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "svetlyachok-pins"
database_id = "cd6ca06d-5fac-477e-8155-71ae29500cbd"

# Личный Telegram-бот (telegram.js): проверка тревог сторожа и свежести данных.
# Секреты задаются отдельно и в репозиторий не попадают: TG_BOT_TOKEN, TG_CLAIM, ADMIN_KEY.
[triggers]
# */10 — бот; */2 — заполнение адресов из Visicom (visicom.js, в пределах VISICOM_DAILY).
crons = ["*/10 * * * *", "*/2 * * * *"]

[vars]
PUBLIC_URL = "https://svetlyachok-pins.svetlyachok.workers.dev"
VISICOM_DAILY = "1400"
