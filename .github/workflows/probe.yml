name: Probe sources
on:
  workflow_dispatch:
  push:
    paths: ['tools/probe_sources.sh', '.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr && pip install -q pillow
      - run: bash tools/probe_sources.sh
