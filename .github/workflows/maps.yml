name: Build maps
# Каждый день пересобираем карты домов из OpenStreetMap и кладём их в ветку maps (только OSM),
# а карту с адресами из своей базы (© Візіком) — только на свой сервер, не в git.
# Сборщик графиков (collect.yml) копирует их в ветку data, откуда их скачивает приложение.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write   # вход на свой сервер: карта с адресами из своей базы и очередь адресов
concurrency:
  group: maps
  cancel-in-progress: false
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Previous maps
        run: |
          mkdir -p out
          if git fetch --depth 1 origin maps; then git --work-tree=out checkout origin/maps -- . ; git reset -q; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build
        env:
          PINS_URL: ${{ vars.PINS_URL || 'https://svetlyachok-pins.svetlyachok.workers.dev' }}
        run: python3 collector/maps/build_maps.py out/v1/maps
      - name: Publish
        run: |
          cd out
          rm -rf .git && git init -q -b maps
          git config user.name "svetlyachok-bot"
          git config user.email "svetlyachok-bot@users.noreply.github.com"
          git add -A && git commit -qm "maps $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" maps
