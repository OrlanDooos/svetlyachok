name: Collect schedules
# Каждые 10 минут собираем графики и публикуем их в ветку data (одним коммитом, без истории).
# Приложение читает https://raw.githubusercontent.com/OrlanDooos/svetlyachok/data/v1/regions.json
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/**', '.github/workflows/collect.yml']
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Previous data
        run: |
          git fetch --depth 1 origin data || true
          mkdir -p collector/out
          if git rev-parse --verify -q origin/data >/dev/null; then git --work-tree=collector/out checkout origin/data -- . ; git reset -q; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Collect
        run: python3 collector/collect.py
      - name: Publish
        run: |
          cd collector/out
          rm -rf .git && git init -q -b data
          git config user.name "svetlyachok-bot"
          git config user.email "svetlyachok-bot@users.noreply.github.com"
          git add -A && git commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
