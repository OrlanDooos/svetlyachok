name: Collect schedules
# Каждую минуту собираем графики, кладём на сервер Cloudflare (быстро) и в ветку data (одним коммитом, без истории).
# Один запуск крутится ~5 ч 40 мин (collector/loop.sh) и в конце перезапускает себя.
# cron остаётся запасным вариантом, если цепочка оборвётся.
# Приложение читает https://raw.githubusercontent.com/OrlanDooos/svetlyachok/data/v1/regions.json
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/**', '.github/workflows/collect.yml']
permissions:
  contents: write
  actions: write
  id-token: write   # вход на сервер Cloudflare (collector/upload.py) без секретов
  issues: write     # сторож (collector/watchdog.py) открывает issue, если графика нет
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Previous data
        run: |
          git fetch --depth 1 origin data || true
          mkdir -p collector/out
          if git rev-parse --verify -q origin/data >/dev/null; then git --work-tree=collector/out checkout origin/data -- . ; git reset -q; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Collect every minute
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: collector/loop.sh
      - name: Restart
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main -R ${{ github.repository }}
